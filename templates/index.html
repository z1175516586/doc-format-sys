<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASE - 高阶段智能排版</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  </head>
  <body>
    <div class="page-wrapper">
      <!-- 左列: 系统信息 -->
      <div class="left-col system-info card">
        <h2><i class="icon-info"></i> 注意事项</h2>
        <ul>
          <li>上传的文档至少包含四部分：封面、设计人员名单、目录和正文</li>
          <li>转换后某些空白字符（如空格、制表符等）会有适当变化</li>
          <li>转换后表题和注释的样式会有适当变化</li>
          <li>
            标题序号请勿跳号或重复，错误编号不会被设置为标题样式，影响目录生成
          </li>
          <li>
            标题序号尽量勿使用自动编号功能，否则可能会导致内容缺失
          </li>
        </ul>
      </div>

      <!-- 中间列: 核心功能区域 -->
      <div class="middle-col container card">
        <h1><i class="icon-doc"></i> 高阶段智能排版</h1>
        <p class="subtitle">上传您的文档，选择模板，一键完成专业格式转换</p>

        <form id="convertForm" enctype="multipart/form-data">
          <div class="form-group">
            <label for="documentFile"
              ><i class="icon-upload"></i> 上传原文档 (支持 .doc, .docx)</label
            >
            <input
              type="file"
              id="documentFile"
              name="file"
              accept=".doc,.docx"
              required
            />
            <p class="hint">请选择需要转换的Word文档</p>
          </div>

          <div class="form-group">
            <label for="templateSelect"
              ><i class="icon-template"></i> 选择排版模板</label
            >
            <select id="templateSelect" name="document_type">
              <option value="" disabled selected>请选择模板类型</option>
              <option value="1">初步设计</option>
              <option value="2">可行性研究</option>
              <option value="3">初步设计(代可研)</option>
              <option value="4">可行性研究(代初设)</option>
            </select>
          </div>

          <button id="convertBtn" type="submit" class="btn-primary">
            <i class="icon-convert"></i> 开始转换文档
          </button>
        </form>

        <!-- 转换结果摘要 -->
        <div id="convertSummary" class="result-card" style="display: none">
          <!-- 下载按钮将由JS动态插入 -->
        </div>

        <!-- 通用消息提示区域 -->
        <div id="result" class="result-message"></div>
      </div>

      <!-- 右列: 文件历史信息 -->
      <div class="right-col history-info card">
        <h2><i class="icon-history"></i> 转换历史</h2>

        <div id="historyContent" class="history-scroll">
          <p class="placeholder-text">请上传文件以查看历史记录</p>
          <div id="fileInfo" class="history-detail" style="display: none"></div>
        </div>
      </div>
    </div>

    <!-- 简单图标字体 (使用Unicode字符模拟) -->
    <style>
      .icon-info::before {
        content: "ℹ️ ";
      }
      .icon-doc::before {
        content: "📄 ";
      }
      .icon-upload::before {
        content: "📤 ";
      }
      .icon-template::before {
        content: "🎨 ";
      }
      .icon-convert::before {
        content: "⚙️ ";
      }
      .icon-history::before {
        content: "⏱️ ";
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        async function streamConvert(formData, documentFile) {
          const response = await fetch("/convert-document/", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error("服务器响应失败");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");

          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            const events = buffer.split("\n\n");
            buffer = events.pop();

            for (const event of events) {
              if (!event.startsWith("data:")) continue;

              const jsonStr = event.replace("data:", "").trim();
              const data = JSON.parse(jsonStr);

              // 实时日志
              if (data.type === "log") {
                const msg = data.message || "";

                // 只处理以“转换进度 xx%”开头的日志
                const match = msg.match(/^转换进度\s*(\d+)%/);

                if (match) {
                  updateButtonText(msg);

                  const progress = parseInt(match[1]);
                  updateConvertProgress(progress);
                }
              }

              // 完成
              if (data.type === "complete") {
                const btn = document.getElementById("convertBtn");
                btn.style.setProperty("--progress", "0%");   // 清除水流进度

                const result = data.data;
                console.log(result)

                summaryDiv.style.display = "block";

                downloadFilename = result.history_id;

                summaryDiv.innerHTML = `
        <div class="success-result">
          <h3><i class="icon-success">✅</i> 转换成功！</h3>
          <button id="downloadBtn" class="btn-download">
            <i class="icon-download">⬇️</i> 下载转换后的文档
          </button>
        </div>
        `;

                const newDownloadBtn = document.getElementById("downloadBtn");

                if (newDownloadBtn) {
                  newDownloadBtn.addEventListener("click", () => {
                    const link = document.createElement("a");
                    link.href = `/result/${downloadFilename}`;
                    // link.download = downloadFilename;

                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                  });
                }

                await fetchHistory(documentFile);
              }

              // 错误
              if (data.type === "error") {
                const result = data.data;

                showMessage(`转换失败: ${result.message}`, "error");
              }
            }
          }
        }

        let downloadFilename = "converted_document.docx";
        const fileInput = document.getElementById("documentFile");
        const convertForm = document.getElementById("convertForm");
        const summaryDiv = document.getElementById("convertSummary");
        const infoDiv = document.getElementById("fileInfo");
        const historyPlaceholder = document.querySelector(".placeholder-text");

        // -----------------------------
        // 1️⃣ 文件点击时重置状态
        // -----------------------------
        fileInput.addEventListener("click", function () {
          if (infoDiv) {
            infoDiv.innerHTML = "";
            infoDiv.style.display = "none";
          }
          if (summaryDiv) {
            summaryDiv.innerHTML = "";
            summaryDiv.style.display = "none";
          }
          if (historyPlaceholder) {
            historyPlaceholder.style.display = "block";
          }
          const resultDiv = document.getElementById("result");
          if (resultDiv) {
            resultDiv.innerHTML = "";
            resultDiv.style.display = "none";
          }
          fileInput.value = "";
        });

        // -----------------------------
        // 2️⃣ 查询历史记录函数
        // -----------------------------
        async function fetchHistory(file) {
          const formData = new FormData();
          formData.append("file", file);
          try {
            const response = await fetch("/check-convert-history/", {
              method: "POST",
              body: formData,
            });
            const result = await response.json();

            if (historyPlaceholder) historyPlaceholder.style.display = "none";
            infoDiv.style.display = "block";
            infoDiv.innerHTML = "";

            if (!result.exists) {
              infoDiv.innerHTML = `<p class="new-file">该文件是首次上传，无转换历史。</p>`;
              return;
            }

            const records = result.records || [];
            const totalTimes = records.length;

            let historyHtml = "";

            // -----------------------------
            // 处理最新文件信息
            // -----------------------------
            if (!result.is_latest && result.latest_files?.length > 0) {
              historyHtml += `<div class="latest-files">
        <h3>⚠️ 上传的文件不是最新版本，可下载最新文件：</h3>
        <ul>
      `;
              result.latest_files.forEach((f) => {
                const latestName = f.file_path
                  ? f.file_path.split(/[/\\]/).pop()
                  : f.node_code;
                historyHtml += `<li>
          <a href="/result/${f.node_code}">${latestName}</a> (创建时间: ${f.created_at})
        </li>`;
              });
              historyHtml += `</ul></div>`;
            }


            historyHtml += `
      <div class="history-total">
        <p class="total-times">
          总转换次数：<span class="total-number">${totalTimes}</span>
        </p>
        <hr class="total-divider">
      </div>
    `;

            if (records.length > 0) {
              const reversedHistory = [...records].reverse();
              reversedHistory.forEach((record, index) => {
                const statusText = record.success === 1 ? "成功" : "失败";
                const filename = record.file_path
                  ? record.file_path.split(/[/\\]/).pop()
                  : null;
                // console.log(record);
                historyHtml += `
          <div class="history-item">
            <p><strong>第 ${totalTimes - index} 次转换</strong></p>
            <p><strong>状态：</strong>
              <span class="status-${
                statusText === "成功" ? "success" : "other"
              }">
                ${statusText}
              </span>
            </p>
            <p><strong>说明：</strong>${record.msg || "无"}</p>
            <p><strong>下载文件：</strong>
              ${
                filename
                  ? `<a href="/result/${result.family_nodes[result.family_nodes.length - index - 1].node_code}">${filename}</a>`
                  : "无"
              }</p>
          </div>
        `;
              });
            } else {
              historyHtml += `<p>历史记录为空</p>`;
            }

            
            infoDiv.innerHTML = historyHtml;
          } catch (error) {
            console.error("查询转换记录失败:", error);
            infoDiv.innerHTML = `<p class="error-msg">查询失败：网络或服务异常</p>`;
          }
        }
        // -----------------------------
        // 3️⃣ 文件选择后自动查询历史
        // -----------------------------
        fileInput.addEventListener("change", async function () {
          const file = this.files[0];
          if (!file) return;
          await fetchHistory(file);
        });

        // -----------------------------
        // 4️⃣ 提交转换表单
        // -----------------------------
        if (convertForm) {
          convertForm.addEventListener("submit", async function (e) {
            e.preventDefault();
            const documentFile = fileInput.files[0];
            const documentType =
              document.getElementById("templateSelect").value;

            if (!documentFile) {
              showMessage("请先选择要转换的文档文件。", "error");
              return;
            }
            if (!documentType) {
              showMessage("请选择一个排版模板。", "error");
              return;
            }

            const formData = new FormData();
            formData.append("file", documentFile);
            formData.append("document_type", documentType);
            formData.append("header_text", "格式化文档");
            formData.append("toc_title", "目      录");

            const button = document.getElementById("convertBtn");
            const originalButtonText = button.innerHTML;
            button.innerHTML = '<i class="icon-convert"></i> 转换中...';
            button.disabled = true;
            button.style.setProperty("--progress", "0%");

            if (summaryDiv) {
              summaryDiv.innerHTML = "";
              summaryDiv.style.display = "none";
            }

            try {
              await streamConvert(formData, documentFile);
            } catch (error) {
              showMessage(`请求失败: ${error.message}`, "error");
            } finally {
              button.innerHTML = originalButtonText;
              button.disabled = false;
            }
          });
        }

        // -----------------------------
        // 5️⃣ 通用消息提示函数
        // -----------------------------
        function showMessage(message, type) {
          const resultDiv = document.getElementById("result");
          if (!resultDiv) return;

          resultDiv.className = `result-message ${type}`;
          resultDiv.textContent = message;
          resultDiv.style.display = "block";
        }

        function updateConvertProgress(progress) {
          const btn = document.getElementById("convertBtn");
          if (!btn) return;

          btn.style.setProperty("--progress", progress + "%");

          if (progress >= 100) {
            btn.classList.add("progress-complete");
          }
        }

        function updateButtonText(text) {
          const btn = document.getElementById("convertBtn");
          if (!btn) return;

          btn.lastChild.nodeValue = " " + text;
        }
      });
    </script>
  </body>
</html>
